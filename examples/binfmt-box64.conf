# /etc/binfmt.d/box64.conf
#
# INSTALACIÓN:
#   sudo cp binfmt-box64.conf /etc/binfmt.d/box64.conf
#   sudo update-binfmts --import box64   # o: sudo systemctl restart systemd-binfmt
#
# VERIFICACIÓN:
#   cat /proc/sys/fs/binfmt_misc/box64   # → ... /usr/local/bin/box64
#   echo 'int main(){return 0;}' > /tmp/t.c && gcc /tmp/t.c -o /tmp/t
#   file /tmp/t            # → ELF 64-bit x86-64
#   /tmp/t && echo OK      # → si sale OK, los ELF x86_64 se ejecutan "solos"
#
# ¿QUÉ HACE?
#   Registra en el kernel que cualquier ELF x86_64 que se intente ejecutar
#   se pase a /usr/local/bin/box64 (emulador x86_64 → ARM64). Gracias a esto,
#   Wine arranca sin prefijos ni wrappers: el binario "se ejecuta solo".
#
# IMPORTANTE:
#   Apunta al box64 COMPILADO en /usr/local/bin/box64 (§3 del README, con
#   -DRPI5ARM64=1). El de apt es 0.3.8 y es MUY anterior — no usarlo.
#   Si compilaste en otra ruta, cambia /usr/local/bin/box64 de la línea de abajo.
#
# El binario debe ser x86_64 little-endian (flag \x02\x00\x3e\x00) con la
# máscara correspondiente — es el patrón estándar para ELF x86-64.

:box64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x3e\x00:\xff\xff\xff\xff\xff\xff\xff\x00\x00\x00\x00\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/local/bin/box64:
