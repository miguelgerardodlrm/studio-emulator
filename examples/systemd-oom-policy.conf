# /etc/systemd/system/tigervnc.service.d/oom.conf
#
# INSTALACIÓN:
#   sudo mkdir -p /etc/systemd/system/tigervnc.service.d
#   sudo cp systemd-oom-policy.conf /etc/systemd/system/tigervnc.service.d/oom.conf
#   sudo systemctl daemon-reload
#
# VERIFICACIÓN:
#   systemctl show tigervnc.service -p OOMPolicy   # → OOMPolicy=continue
#
# ¿POR QUÉ ESTE FICHERO EXISTE?
#   Sin él, el default de systemd es OOMPolicy=stop: si el OOM killer actúa
#   dentro de la unidad (una sesión de escritorio = TODO el escritorio), para
#   la unidad ENTERA → mata a Xtigervnc → pantalla congelada.
#   Con OOMPolicy=continue, si Studio se pasa de memoria muere Studio y el
#   escritorio sigue vivo.
#
# ⚠️ NO usar `systemctl set-property tigervnc.service OOMPolicy=continue`:
#    en systemd 259 devuelve "Cannot set property OOMPolicy". Hay que usar
#    este drop-in.
#
# Acompañar con swap (sin swap, la memoria anónima no es reclaimable y el
# OOM es inevitable) — ver README §11.1.

[Service]
OOMPolicy=continue
