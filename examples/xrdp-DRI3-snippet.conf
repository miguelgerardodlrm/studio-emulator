# =============================================================================
# DRI3 en la sesión xrdp — EL CAMBIO QUE HACE POSIBLE EL MODO "DIRECTO"
# =============================================================================
# Archivo: /etc/X11/xrdp/xorg.conf
# ⚠️ NO sobrescribas tu xorg.conf con este fichero: son SOLO las dos líneas que
#    hay que añadir a tu config existente (README §5a).
#
# ¿POR QUÉ?
#   Sin DRI3, Studio no puede presentar frames acelerados y termina en
#   llvmpipe (renderizado por CPU) o directamente falla con:
#       "Cannot create window: no screens available"  /  error c0000409
#   Con DRI3, la sesión X accede directo a /dev/dri y usa la GPU real.
#
# VERIFICACIÓN (tras reconectar la sesión):
#   xdpyinfo | grep DRI3          # → DRI3
#   glxinfo -B | grep renderer    # → V3D 7.1.10.2   (¡NO llvmpipe!)
#
# -----------------------------------------------------------------------------
# LÍNEA 1 — dentro de Section "Module" (añadir junto a los demás Load):
# -----------------------------------------------------------------------------
#     Load "glamoregl"
#
# -----------------------------------------------------------------------------
# LÍNEA 2 — dentro de Section "Device" (la que usa Driver "xrdpdev"):
# -----------------------------------------------------------------------------
#     Option "DRI3" "1"
#
# -----------------------------------------------------------------------------
# Contexto de esas secciones (para que sepas dónde van):
# -----------------------------------------------------------------------------
# Section "Module"
#     ...
#     Load "glamoregl"          <-- AQUÍ
# EndSection
#
# Section "Device"
#     Identifier  "Roofball Virtual DRM"
#     Driver      "xrdpdev"
#     Option      "DRMDevice"   "/dev/dri/renderD128"
#     Option      "DRI3" "1"    <-- AQUÍ
#     Option      "DRMAllowList" "i915 radeon"
# EndSection
#
# Nota: DRMDevice apunta a renderD128, que es el render-node de la GPU
# (v3dv en la Pi). El usuario debe estar en los grupos `video` y `render`.
#
# Tras editar: cierra la sesión xrdp y vuelve a conectarte (no basta reiniciar
# el window manager).
